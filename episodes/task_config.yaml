task:
  type: object_nav
navmesh:
  default:
    cell_size: 0.08
    cell_height: 0.1
    agent_height: 0.61
    agent_radius: 0.3
    agent_max_climb: 0.1
    agent_max_slope: 30.0
    region_min_size: 0.5
    region_merge_size: 0.5
    edge_max_len: 5.0
    edge_max_error: 1.3
    verts_per_poly: 6.0
    detail_sample_dist: 1.0
    detail_sample_max_error: 1.0
  outdoor:
    cell_size: 0.5
    cell_height: 0.1
    agent_height: 0.61
    agent_radius: 0.3
    agent_max_climb: 0.1
    agent_max_slope: 30.0
    region_min_size: 0.5
    region_merge_size: 0.5
    edge_max_len: 5.0
    edge_max_error: 1.3
    verts_per_poly: 6.0
    detail_sample_dist: 1.0
    detail_sample_max_error: 1.0
scene:
  test:
    scene_scale: 1.0
    collider: true
    align_ground: true
    episodes:
      generator:
        path: generator
        episode_number: 30
        navmesh_preset: default
        goal_rules:
          mailbox: "MailboxType.*"
  nv:
    scene_scale: 1.0
    collider: true
    align_ground: true
    episodes:
      parkmorning:
        path: nvidia_edit/park/park_morning_edit.usd
        episode_number: 30
        navmesh_preset: outdoor
        goal_rules:
          mailbox: "MailboxType.*"
          park_bench: "ParkBench.*"
          hydrant: "Hydrant_.*"
      parktest:
        path: nvidia/AECDemo_NVD@10012/Demos/AEC/BrownstoneDemo/test.usd
        episode_number: 30
        navmesh_preset: outdoor
        goal_rules:
          mailbox: "MailboxType.*"
          park_bench: "ParkBench.*"
          hydrant: "Hydrant_.*"
  vc:
    scene_scale: 1.0
    collider: true
    align_ground: true
    episodes:
      berlin:
        path: virtual_community/BERLIN/BERLIN.usd
        episode_number: 30
        navmesh_preset: default
        goal_rules:
          street_lamp: "Street_Lamp.*"
          city_bench: "City_Bench.*"
          tree: "Tree.*"