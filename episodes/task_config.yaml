scene:
  grCommercial:
    align_ground: false
    collider: true
    episodes:
      hospital:
        episode_number: 30
        goal_rules:
          bed: bed/model_[^/]*/Instance$
          cabinet: cabinet/model_[^/]*/Instance$
          couch: couch/model_[^/]*/Instance$
          counter: counter/model_[^/]*/Instance$
          cup: cup/model_[^/]*/Instance$
          faucet: faucet/model_[^/]*/Instance$
          shelf: shelf/model_[^/]*/Instance$
          sink: sink/model_[^/]*/Instance$
          trash_can: trash_can/model_[^/]*/Instance$
        navmesh_exclude:
        - /World/ground/terrain/__default_setting/HDR_Sphere/SM_Sphere
        navmesh_preset: default
        path: grscenes_commercial/scenes/MV4AFHQKTKJZ2AABAAAAADQ8_usd/start_result_navigation.usd
        rule_pattern: path
    scene_scale: 0.009999999776482582
  nv:
    align_ground: true
    collider: true
    episodes:
      parkmorning:
        episode_number: 30
        goal_rules:
          hydrant: Hydrant_.*
          mailbox: MailboxType.*
          park_bench: ParkBench.*
          trash_bin: OutdoorTrash.*
          trash_can: TrashCan.*
        navmesh_exclude: []
        navmesh_preset: outdoor
        path: nvidia_edit/park/park_morning_flatten_edit.usd
        rule_pattern: name
      parktest:
        episode_number: 30
        goal_rules:
          hydrant: Hydrant_.*
          mailbox: MailboxType.*
          park_bench: ParkBench.*
        navmesh_exclude: []
        navmesh_preset: outdoor
        path: nvidia/AECDemo_NVD@10012/Demos/AEC/BrownstoneDemo/test.usd
        rule_pattern: name
    scene_scale: 0.01
  test:
    align_ground: true
    collider: true
    episodes:
      generator:
        episode_number: 30
        goal_rules:
          mesh: mesh
        navmesh_exclude: []
        navmesh_preset: default
        path: generator
        rule_pattern: name
    scene_scale: 1.0
  vc:
    align_ground: true
    collider: true
    episodes:
      amsterdam:
        episode_number: 30
        goal_rules:
          city_bench: .*Bench.*
          sign: .*sign.*
          street_lamp: Street_.*
          traffic_light: .*traffic_light.*
          tree: .*Tree.*
        navmesh_exclude: []
        navmesh_preset: vc
        path: virtual_community/AMSTERDAM/AMSTERDAM_with_road_objects.usd
        rule_pattern: name
      austin:
        episode_number: 30
        goal_rules: &id003
          city_bench: .*Bench.*
          sign: .*sign.*
          street_lamp: Street_.*
          traffic_light: .*traffic_light.*
          tree: .*Tree.*
        navmesh_exclude: &id004 []
        navmesh_preset: vc
        path: virtual_community/AUSTIN/AUSTIN_with_road_objects_modified.usd
        rule_pattern: name
      baltimore:
        episode_number: 30
        goal_rules: &id001
          city_bench: .*Bench.*
          sign: .*sign.*
          street_lamp: Street_.*
          traffic_light: .*traffic_light.*
          tree: .*Tree.*
        navmesh_exclude: &id002 []
        navmesh_preset: vc
        path: virtual_community/BALTIMORE/BALTIMORE_with_road_objects_modified.usd
        rule_pattern: name
      barcelona:
