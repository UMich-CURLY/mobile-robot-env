navmesh:
  default:
    agent_height: 0.3
    agent_max_climb: 0.05
    agent_max_slope: 26.0
    agent_radius: 0.3
    cell_height: 0.1
    cell_size: 0.08
    detail_sample_dist: 1.0
    detail_sample_max_error: 1.0
    edge_max_error: 1.3
    edge_max_len: 5.0
    region_merge_size: 0.5
    region_min_size: 0.5
    verts_per_poly: 6.0
  outdoor:
    agent_height: 0.61
    agent_max_climb: 0.1
    agent_max_slope: 30.0
    agent_radius: 0.3
    cell_height: 0.1
    cell_size: 0.5
    detail_sample_dist: 1.0
    detail_sample_max_error: 1.0
    edge_max_error: 1.3
    edge_max_len: 5.0
    region_merge_size: 0.5
    region_min_size: 0.5
    verts_per_poly: 6.0
scene:
  nv:
    align_ground: true
    collider: true
    episodes:
      parkmorning:
        episode_number: 30
        goal_rules:
          hydrant: Hydrant_.*
          mailbox: MailboxType.*
          park_bench: ParkBench.*
        navmesh_preset: outdoor
        path: nvidia_edit/park/park_morning_edit.usd
      parktest:
        episode_number: 30
        goal_rules:
          hydrant: Hydrant_.*
          mailbox: MailboxType.*
          park_bench: ParkBench.*
        navmesh_preset: outdoor
        path: nvidia/AECDemo_NVD@10012/Demos/AEC/BrownstoneDemo/test.usd
    scene_scale: 1.0
  test:
    align_ground: true
    collider: true
    episodes:
      generator:
        episode_number: 30
        goal_rules:
          mesh: mesh
        navmesh_preset: default
        path: generator
    scene_scale: 1.0
  vc:
    align_ground: true
    collider: true
    episodes:
      berlin:
        episode_number: 30
        goal_rules:
          city_bench: City_Bench.*
          street_lamp: Street_Lamp.*
          tree: Tree.*
        navmesh_preset: default
        path: virtual_community/BERLIN/BERLIN.usd
    scene_scale: 1.0
task:
  type: object_nav
